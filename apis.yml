aid: hakuna
name: Hakuna
description: >-
  hakuna AG is a Swiss digital time-tracking and personnel-management platform
  for SMEs. The browser- and mobile-based product centralizes workforce
  administration: time recording with a running timer, absence and vacation
  management, expense processing, project and client tracking, task
  categorization, shift planning, personnel records, and compliance monitoring
  against Swiss labor-law requirements. hakuna is "100% Swiss" — all data is
  stored in Switzerland under Swiss data-protection law (DSG) — and requires no
  additional hardware terminals or badges. It exposes a token-authenticated REST
  API (X-Auth-Token) over JSON at app.hakuna.ch/api/v1 covering the timer, time
  entries, absences, projects, tasks, clients, users, company settings, and an
  organization-wide presence status endpoint, with admin-only management
  endpoints and a documented 100 requests/minute rate limit.
