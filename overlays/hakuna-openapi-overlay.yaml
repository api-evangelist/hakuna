overlay: 1.0.0
info:
  title: API Evangelist enhancements for hakuna Time Tracking API
  version: 1.0.0
extends: openapi/hakuna-openapi.yml
actions:
- target: $.info
  update:
    x-apievangelist-provenance: Generated by the API Evangelist enrichment pipeline from https://app.hakuna.ch/api_docs
    x-apievangelist-rate-limit: 100 requests per minute per customer
    x-apievangelist-data-residency: Switzerland (Swiss DSG)
- target: $.info
  update:
    x-apievangelist-artifacts:
      authentication: authentication/hakuna-authentication.yml
      conventions: conventions/hakuna-conventions.yml
      errors: errors/hakuna-problem-types.yml
      rate-limits: rate-limits/hakuna-rate-limits.yml
      lifecycle: lifecycle/hakuna-lifecycle.yml
      data-model: data-model/hakuna-data-model.yml
